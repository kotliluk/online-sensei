<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="OnlineSensei - Online training assistant for karate" />
    <link rel="icon" href="/online-sensei/favicon.ico" />
    <link rel="apple-touch-icon" href="/online-sensei/logo192.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/online-sensei/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/online-sensei/favicon-16x16.png" />
    <link rel="manifest" href="/online-sensei/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap"
    />
    <title>OS! OnlineSensei</title>
    <script>
      // Restores the real URL after public/404.html encoded it into a query
      // string, so react-router sees the path that was actually requested.
      // Must run before the app bundle, hence the inline script in <head>.
      //
      // Adapted from https://github.com/rafgraph/spa-github-pages
      ;(function () {
        var l = window.location
        if (l.search[1] !== '/') {
          return
        }
        var decoded = l.search
          .slice(1)
          .split('&')
          .map(function (s) { return s.replace(/~and~/g, '&') })
          .join('?')
        window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash)
      })()
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <div id="modal-root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
